

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/vehicle_tracking_system_db
spring.datasource.username=postgres
spring.datasource.password=Mastek12
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# AWS Region & Credentials
spring.cloud.aws.region.static=eu-west-1
spring.cloud.aws.credentials.access-key=
spring.cloud.aws.credentials.secret-key=

# S3
aws.s3.bucket-name=vehicle-violations-csv

# SQS
spring.cloud.aws.sqs.enabled=true
spring.cloud.aws.stack.auto=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always