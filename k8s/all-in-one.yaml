apiVersion: v1
kind: Namespace
metadata:
  name: vehicle-compliance
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: vehicle-compliance
type: Opaque
stringData:
  POSTGRES_DB: vehicle_tracking_system_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: Mastek12
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-secret
  namespace: vehicle-compliance
type: Opaque
stringData:
  AWS_REGION: eu-west-1
  AWS_ACCESSKEYID: replace-me
  AWS_SECRETKEY: replace-me
  SPRING_CLOUD_AWS_REGION_STATIC: eu-west-1
  SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: replace-me
  SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: replace-me
  AWS_S3_BUCKET_NAME: replace-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: vehicle-compliance
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vehicle-compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: vehicle-compliance
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: vehicle-compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
        - name: spring-app
          image: vehicle-insurance-compliance-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/vehicle_tracking_system_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_REGION
            - name: AWS_ACCESSKEYID
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_ACCESSKEYID
            - name: AWS_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRETKEY
            - name: SPRING_CLOUD_AWS_REGION_STATIC
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: SPRING_CLOUD_AWS_REGION_STATIC
            - name: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
            - name: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_S3_BUCKET_NAME
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app-service
  namespace: vehicle-compliance
spec:
  type: NodePort
  selector:
    app: spring-app
  ports:
    - name: http
      port: 8081
      targetPort: 8081
